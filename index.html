<!DOCTYPE HTML>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make the Excuse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="strip" aria-hidden="true"><div class="track" id="track"></div></div>
    <main class="hero">
        <section>
            <div id="intro">
                <p class="tag"> A game about lying to your teacher</p>
                <h1> Why dont you have your <mark>homework?</mark></h1>
                <p class = "lede">Mr.pruitt is waiting. Type your own excuses for five rounds and make him keep believing for five rounds. He remembers everything you say. and he has already heard the one about the dog.</p>
                <button class="btn" type="button" id="start"> Start EXcusing</button>
                <p class="fine"> Will take 2 minutes.homework not required</p>
            </div>

            <div id = "play" hidden></div>
        </section>
    </main>
</body>
</html>
